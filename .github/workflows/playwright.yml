name: Quality & Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run React Doctor Diagnostic Guard
        run: npm run doctor

  test:
    needs: doctor
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Java 21 Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies."@playwright/test".version')" >> $GITHUB_OUTPUT
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          key: playwright-${{ steps.playwright-version.outputs.version }}
          path: ~/.cache/ms-playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Build Application
        run: npm run build --if-present
      - name: Run Unit Tests with Coverage
        run: npm run coverage
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: SonarCloud Scan Execution
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: -Dsonar.exclusions=src/mocks/**,e2e/**,**/*.test.ts,**/*.test.tsx,**/*.styles.test.tsx -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.projectKey=northern-route-web -Dsonar.projectName="NorthernRoute Web" -Dsonar.projectVersion=1.0.0 -Dsonar.sources=src -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx -Dsonar.tests=src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e-results/
          retention-days: 7
