name: Quality & Automation Pipeline

on:
  push:
    branches: [main, master, qas]
  pull_request:
    branches: [main, master, qas]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run React Doctor Diagnostic Guard
        run: npm run doctor

  static-analysis:
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Code Linting
        run: npm run lint
      - name: Check Code Formatting
        run: npm run format -- --check

  unit-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Unit Tests with Coverage
        run: npm run coverage
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/

  playwright-e2e:
    needs: static-analysis
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Java 21 Runtime Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e-results/
          retention-days: 7

  sonar-cloud:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lcov-report
          path: coverage/
      - name: SonarCloud Scan Execution
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deployment:
    needs: [playwright-e2e, sonar-cloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '24'
      - name: Install Vercel CLI Global Binary
        run: npm install -g vercel
      - name: Pull Vercel Environment Meta Configurations
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Execute Verified Quality Remote Cloud Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Verified Artifacts to Target Vercel Edge Nodes
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
