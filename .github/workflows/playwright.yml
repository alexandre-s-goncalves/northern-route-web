name: Quality & Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select deployment target environment context'
        required: true
        default: 'qas'
        type: choice
        options:
          - qas
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run React Doctor Diagnostic Guard
        run: npm run doctor

  static-analysis:
    needs: doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check Code Linting
        run: npm run lint
      - name: Check Code Formatting
        run: npm run format -- --check

  unit-tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Unit Tests with Coverage
        run: npm run coverage
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/

  playwright-e2e:
    needs: static-analysis
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Set up Java 21 Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies."@playwright/test".version')" >> $GITHUB_OUTPUT
      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          key: playwright-${{ steps.playwright-version.outputs.version }}
          path: ~/.cache/ms-playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright Tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e-results/
          retention-days: 7

  sonar-cloud:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: lcov-report
          path: coverage/
      - name: SonarCloud Scan Execution
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deployment:
    needs: [playwright-e2e, sonar-cloud]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node Runtime
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Setup Deployment Environment Context
        id: deploy-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "mode=prod" >> $GITHUB_OUTPUT
            echo "route=/northern-route-web/" >> $GITHUB_OUTPUT
          else
            echo "mode=qas" >> $GITHUB_OUTPUT
            echo "route=/northern-route-web/qas/" >> $GITHUB_OUTPUT
          fi
      - name: Build Application Packaging Matrix
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_QA }}
        run: |
          if [ "${{ steps.deploy-env.outputs.mode }}" = "prod" ]; then
            npm run build
          else
            npm run build:qa
          fi
      - name: Organize Multitenant Distribution Tree
        run: |
          if [ "${{ steps.deploy-env.outputs.mode }}" = "prod" ]; then
            mkdir -p deploy_dist
            cp -r dist/* deploy_dist/
            cp deploy_dist/index.html deploy_dist/404.html
          else
            mkdir -p deploy_dist/qas
            cp -r dist/* deploy_dist/qas/
            cp deploy_dist/qas/index.html deploy_dist/qas/404.html
          fi
      - name: Deploy Compiled Artifacts to GitHub Pages Target Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          clean: false
          folder: deploy_dist
