<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northern Route Logistics</title>
    <script type="text/javascript">
      var l = window.location;
      var repoName = 'northern-route-web';

      var base =
        l.pathname.includes('/' + repoName + '/qas') !== -1
          ? '/' + repoName + '/qas'
          : '/' + repoName;

      var path = l.pathname.slice(base.length);

      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          base +
          '/?p=' +
          path.replaceAll('&', '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replaceAll('&', '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
