<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Northern Route Logistics</title>
    <script type="text/javascript">
      var segments = window.location.pathname.split('/');
      var pathSegmentsToKeep =
        segments.includes('northern-route-web') !== -1
          ? segments.indexOf('northern-route-web') + 1
          : 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=' +
          l.pathname
            .split('/')
            .slice(1 + pathSegmentsToKeep)
            .join('/')
            .replaceAll('&', '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replaceAll('&', '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
